_target_: transformers.ViTForImageClassification
config:
  _target_: transformers.ViTConfig

  image_size: 224
  patch_size: 16

  # ViT-B/16 defaults. Override from configs/padchest.yaml or CLI to scale down:
  #   model.config.num_hidden_layers=6 model.config.hidden_size=384 ...
  num_hidden_layers: 12
  hidden_size: 768
  num_attention_heads: 12
  intermediate_size: 3072

  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
