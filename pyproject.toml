[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pragmatixs"]

[project]
name = "pragmatixs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40.0",
  "dotenv>=0.9.9",
  "hydra-core>=1.3.2",
  "ipykernel>=7.2.0",
  "iterative-stratification>=0.1.9",
  "loguru>=0.7.3",
  "matplotlib>=3.10.8",
  "numpy<2",
  "open-clip-torch>=3.3.0",
  "pandas>=2.3.3",
  "scikit-learn>=1.8.0",
  "seaborn>=0.13.2",
  "tabulate>=0.10.0",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "tqdm>=4.67.3",
  "transformers>=5.5.0",
  "wandb>=0.25.1",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.15.8"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.ruff]
line-length = 88
exclude = [".venv", "stash"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741", "E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F821"]
